<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720">
<style>text{font-family:'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'SimHei', sans-serif;}</style>
<defs>
<marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
<marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1000" height="720" fill="#ffffff"/>
<text x="40" y="36" font-size="19" fill="#111827" text-anchor="start" font-weight="600">soul_buddy 后端分层与依赖方向</text>
<text x="40" y="58" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">D1 修订：permissions/ 提升为与 tools/ 平级的顶层包；agent.py 是唯一编排者；只抽象真正会变的三处（ADR-004）</text>
<rect x="40" y="86" width="920" height="70" rx="8" ry="8" fill="#fbfdff" stroke="#dbeafe" stroke-width="1.5"/>
<text x="52" y="108" font-size="13" fill="#1d4ed8" text-anchor="start" font-weight="600">① 交付层 · api/</text>
<text x="52" y="130" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">main.py · runtime.py（workers=1 断言 + 启动对账） · routers/{sessions, runs, events, permissions, acp, maintenance, shutdown}</text>
<rect x="340" y="190" width="320" height="76" rx="8" ry="8" fill="#ffffff" stroke="#93b4f5" stroke-width="1.5"/>
<rect x="346" y="196" width="308" height="64" rx="6" ry="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="500" y="216" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="600">② 编排层 · agent.py</text>
<text x="500" y="238" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">SoulAgent.run()</text>
<text x="500" y="254" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">工具串行 · 轮次控制 · 循环保护</text>
<rect x="40" y="340" width="172" height="96" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="126" y="364" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">permissions/</text>
<text x="126" y="386" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">policy · normalize</text>
<text x="126" y="403" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">bash_scan · scope</text>
<text x="126" y="420" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">gate · memory</text>
<text x="50" y="356" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">③-a</text>
<rect x="227" y="340" width="172" height="96" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="313" y="364" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">tools/</text>
<text x="313" y="386" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">registry · bash</text>
<text x="313" y="403" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">fs · env</text>
<text x="237" y="356" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">③-b</text>
<rect x="414" y="340" width="172" height="96" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="500" y="364" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">context/</text>
<text x="500" y="386" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">tokens · externalize</text>
<text x="500" y="403" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">compact · prompt</text>
<text x="424" y="356" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">③-c</text>
<rect x="601" y="340" width="172" height="96" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="687" y="364" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">providers/</text>
<text x="687" y="386" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">base · deepseek</text>
<text x="687" y="403" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">anthropic · openai</text>
<text x="687" y="420" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">offline</text>
<text x="611" y="356" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">③-d</text>
<rect x="788" y="340" width="172" height="96" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="874" y="364" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">memory/</text>
<text x="874" y="386" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">db · workspace</text>
<text x="874" y="403" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">user · cloud</text>
<text x="798" y="356" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">③-e</text>
<path d="M 500 266 L 500 300 L 126 300" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
<path d="M 500 300 L 874 300" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
<path d="M 126 300 L 126 340" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
<path d="M 313 300 L 313 340" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
<path d="M 500 300 L 500 340" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
<path d="M 687 300 L 687 340" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
<path d="M 874 300 L 874 340" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
<rect x="40" y="470" width="920" height="70" rx="8" ry="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="52" y="492" font-size="13" fill="#334155" text-anchor="start" font-weight="600">④ 基础设施（单一实现 · 不做接口抽象）</text>
<text x="52" y="514" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">storage（JSONL 唯一真相） · audit（哈希链） · events（进程内总线，仅支持单进程） · memory/db（SQLite 派生索引，可重建）</text>
<path d="M 500 436 L 500 470" fill="none" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a-gray)"/>
<path d="M 687 436 L 687 470" fill="none" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a-gray)"/>
<path d="M 874 436 L 874 470" fill="none" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a-gray)"/>
<line x1="126" y1="452" x2="190" y2="452" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="250" y1="452" x2="313" y2="452" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="220" y="456" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">✕ 互不感知</text>
<rect x="40" y="566" width="920" height="100" rx="8" ry="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
<text x="52" y="588" font-size="13" fill="#92400e" text-anchor="start" font-weight="600">抽象策略（ADR-004）：只抽象真正会变的三处，其余直接依赖具体类</text>
<text x="52" y="612" font-size="11" fill="#78350f" text-anchor="start" font-weight="400">① Provider — 4 实现：deepseek / anthropic / openai / offline</text>
<text x="400" y="612" font-size="11" fill="#78350f" text-anchor="start" font-weight="400">② PermissionGate — 3 通道：终端 / REST / 桌面弹窗</text>
<text x="730" y="612" font-size="11" fill="#78350f" text-anchor="start" font-weight="400">③ RemoteMemoryStore — 2 实现：mock / 真实</text>
<text x="52" y="634" font-size="11" fill="#78350f" text-anchor="start" font-weight="400">依赖规则：agent → permissions（判定）｜agent → tools（执行）｜两者互不感知，由 agent 编排</text>
<text x="52" y="652" font-size="11" fill="#a16207" text-anchor="start" font-weight="400">新增执行路径（MCP 工具 / skill 脚本）必须先过 permissions 门 —— 这是 D1 把权限提升为顶层包的唯一理由</text>
<line x1="40" y1="694" x2="70" y2="694" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
<text x="78" y="698" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">依赖方向（上层 → 下层，禁止反向）</text>
<line x1="360" y1="694" x2="390" y2="694" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="398" y="698" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">禁止的耦合（permissions 与 tools 互不感知）</text>
</svg>