<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
<style>text{font-family:'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'SimHei', sans-serif;}</style>
<defs>
<marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
<marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1000" height="800" fill="#ffffff"/>
<text x="40" y="36" font-size="19" fill="#111827" text-anchor="start" font-weight="600">soul_buddy · 一次 run 的时序图（SSE snapshot-first + ask 挂起恢复）</text>
<text x="40" y="58" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">原则：先落盘 JSONL 再推 SSE；每次状态变更先发 snapshot 全量，再发 delta；ask 时挂起 run 等待决策</text>
<text x="140" y="86" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="600">UI</text>
<rect x="126" y="88" width="28" height="660" rx="6" ry="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="320" y="86" font-size="12" fill="#0891b2" text-anchor="middle" font-weight="600">main</text>
<rect x="306" y="88" width="28" height="660" rx="6" ry="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="520" y="86" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="600">sidecar</text>
<rect x="506" y="88" width="28" height="660" rx="6" ry="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="720" y="86" font-size="12" fill="#9333ea" text-anchor="middle" font-weight="600">LLM</text>
<rect x="706" y="88" width="28" height="660" rx="6" ry="6" fill="#ffffff" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="900" y="86" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="600">disk</text>
<rect x="886" y="88" width="28" height="660" rx="6" ry="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,3"/>
<path d="M 140 130 L 320 130" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
<text x="230.0" y="125" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">提交 run 请求</text>
<path d="M 320 156 L 520 156" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a-blue)"/>
<text x="420.0" y="151" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">POST /runs + httpOnly cookie（spawn 时已握手）</text>
<path d="M 520 182 L 900 182" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
<text x="710.0" y="177" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">append run_created（JSONL, snapshot-first）</text>
<path d="M 900 208 L 520 208" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-green)"/>
<text x="710.0" y="203" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">ok</text>
<path d="M 520 234 L 140 234" fill="none" stroke="#9333ea" stroke-width="1.4" marker-end="url(#a-purple)"/>
<text x="330.0" y="229" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">SSE: snapshot(run=created)</text>
<text x="560" y="246" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">— loop 开始 —</text>
<text x="40" y="260" font-size="10" fill="#6b7280" text-anchor="start" font-weight="600">迭代 1</text>
<path d="M 520 262 L 720 262" fill="none" stroke="#9333ea" stroke-width="1.4" marker-end="url(#a-purple)"/>
<text x="620.0" y="257" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">ToolSpec + messages</text>
<path d="M 720 286 L 520 286" fill="none" stroke="#9333ea" stroke-width="1.4" marker-end="url(#a-purple)"/>
<text x="620.0" y="281" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">ModelTurn(tool_calls)</text>
<path d="M 520 310 L 520 310" fill="none" stroke="#ea580c" stroke-width="1.4" marker-end="url(#a-orange)"/>
<text x="520.0" y="305" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">PermissionGate.decide（内部）</text>
<path d="M 520 334 L 900 334" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
<text x="710.0" y="329" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">append tool_use（执行前）</text>
<path d="M 900 356 L 520 356" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-green)"/>
<text x="710.0" y="351" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">ok</text>
<path d="M 520 378 L 140 378" fill="none" stroke="#9333ea" stroke-width="1.4" marker-end="url(#a-purple)"/>
<text x="330.0" y="373" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">SSE: delta(tool_call card)</text>
<path d="M 520 402 L 520 402" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
<text x="520.0" y="397" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">execute tool（bash 二次扫描）</text>
<path d="M 520 426 L 900 426" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
<text x="710.0" y="421" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">append tool_result</text>
<path d="M 900 448 L 520 448" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-green)"/>
<text x="710.0" y="443" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">ok</text>
<path d="M 520 470 L 140 470" fill="none" stroke="#9333ea" stroke-width="1.4" marker-end="url(#a-purple)"/>
<text x="330.0" y="465" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">SSE: delta(tool_result)</text>
<text x="40" y="498" font-size="10" fill="#6b7280" text-anchor="start" font-weight="600">迭代 2</text>
<path d="M 520 500 L 720 500" fill="none" stroke="#9333ea" stroke-width="1.4" marker-end="url(#a-purple)"/>
<text x="620.0" y="495" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">ToolSpec + messages</text>
<path d="M 720 524 L 520 524" fill="none" stroke="#9333ea" stroke-width="1.4" marker-end="url(#a-purple)"/>
<text x="620.0" y="519" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">ModelTurn(tool_calls)</text>
<path d="M 520 548 L 520 548" fill="none" stroke="#ea580c" stroke-width="1.4" marker-end="url(#a-orange)"/>
<text x="520.0" y="543" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">PermissionGate.decide（内部）</text>
<path d="M 520 572 L 900 572" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
<text x="710.0" y="567" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">append tool_use（执行前）</text>
<path d="M 900 594 L 520 594" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-green)"/>
<text x="710.0" y="589" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">ok</text>
<path d="M 520 616 L 140 616" fill="none" stroke="#9333ea" stroke-width="1.4" marker-end="url(#a-purple)"/>
<text x="330.0" y="611" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">SSE: delta(tool_call card)</text>
<path d="M 520 640 L 520 640" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
<text x="520.0" y="635" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">execute tool（bash 二次扫描）</text>
<path d="M 520 664 L 900 664" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
<text x="710.0" y="659" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">append tool_result</text>
<path d="M 900 686 L 520 686" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-green)"/>
<text x="710.0" y="681" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">ok</text>
<path d="M 520 708 L 140 708" fill="none" stroke="#9333ea" stroke-width="1.4" marker-end="url(#a-purple)"/>
<text x="330.0" y="703" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">SSE: delta(tool_result)</text>
<text x="40" y="736" font-size="10" fill="#dc2626" text-anchor="start" font-weight="600">ask 挂起</text>
<path d="M 520 738 L 140 738" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-red)"/>
<text x="330.0" y="733" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">SSE: ask(permission_request)</text>
<path d="M 140 762 L 320 762" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-red)"/>
<text x="230.0" y="757" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">转发到桌面弹窗</text>
<path d="M 320 786 L 140 786" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-red)"/>
<text x="230.0" y="781" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">用户决策（允许/拒绝）</text>
<path d="M 140 808 L 320 808" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-red)"/>
<text x="230.0" y="803" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">用户点击</text>
<path d="M 320 830 L 520 830" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-red)"/>
<text x="420.0" y="825" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">POST /permissions/decision</text>
<path d="M 520 854 L 900 854" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
<text x="710.0" y="849" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">append decision</text>
<path d="M 900 876 L 520 876" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-green)"/>
<text x="710.0" y="871" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">ok</text>
<path d="M 520 898 L 140 898" fill="none" stroke="#9333ea" stroke-width="1.4" marker-end="url(#a-purple)"/>
<text x="330.0" y="893" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">SSE: snapshot(run=resumed)</text>
<text x="40" y="926" font-size="10" fill="#16a34a" text-anchor="start" font-weight="600">结束</text>
<path d="M 520 928 L 900 928" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-green)"/>
<text x="710.0" y="923" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">append run_completed</text>
<path d="M 900 950 L 520 950" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-green)"/>
<text x="710.0" y="945" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">ok</text>
<path d="M 520 972 L 140 972" fill="none" stroke="#9333ea" stroke-width="1.4" marker-end="url(#a-purple)"/>
<text x="330.0" y="967" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="400">SSE: snapshot(run=completed)</text>
<text x="40" y="770" font-size="11" fill="#374151" text-anchor="start" font-weight="400">交互契约：前端先用最近一次 snapshot 渲染全量，再叠加 delta；ask 期间 run 状态= suspended，决策到达后 resume，不丢上下文。</text>
<text x="40" y="790" font-size="11" fill="#374151" text-anchor="start" font-weight="400">磁盘是唯一真相：每条事件先 JSONL 落盘（崩溃安全、可回放），审计哈希链 head 单调，SSE 只是它的投影。</text>
</svg>