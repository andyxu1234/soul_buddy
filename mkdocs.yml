site_name: SoulBuddy 手册
site_description: 一个"真能干活"的桌面 coding agent 的设计与实现（Electron + FastAPI + 真实 LLM tool-calling loop）
site_url: https://andyxu1234.github.io/soul_buddy/
copyright: Copyright &copy; 2026 andyxu1234
repo_url: https://github.com/andyxu1234/soul_buddy
repo_name: andyxu1234/soul_buddy
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# 排除生成脚本，不进入站点输出
exclude_docs: |
  _gen_*.py

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

nav:
  - 简介: README.md
  - 概览:
      - 项目总览: overview.md
      - 可行性分析: feasibility-analysis.md
  - 设计与实现:
      - 实施计划: implementation-plan.md
      - Subagent 架构: subagents-architecture.md
      - 模块索引: modules/INDEX.md
      - 与 learn-workbuddy 对照: learn-workbuddy-mapping.md
  - 模块详解:
      - 01 配置与全局常量: modules/01-config.md
      - 02 数据模型: modules/02-models.md
      - 03 事件总线与 SSE: modules/03-events.md
      - 04 持久化（JSONL transcript）: modules/04-storage.md
      - 05 审计链: modules/05-audit.md
      - 06 Agent 执行循环: modules/06-agent.md
      - 07 Provider 适配层: modules/07-providers.md
      - 08 权限治理层: modules/08-permissions.md
      - 09 工具执行层: modules/09-tools.md
      - 10 上下文管理: modules/10-context.md
      - 11 记忆层: modules/11-memory.md
      - 12 API 与实时通道: modules/12-api.md
      - 13 桌面壳 / 打包 / 安装: modules/13-desktop.md
  - 工程记录:
      - 工具权限设计: problems/001-tools-permissions-design.md
      - Subagent 阻塞事件循环: problems/002-subagent-blocks-event-loop.md
      - 文件历史快照: problems/file-history-snapshot.md
  - 测试:
      - 测试分析: test-analysis.md
      - 测试用例: test-cases.md
