name: Sync docs to public book repo

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push docs snapshot to soul_buddy-docs
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_PUSH_TOKEN }}
        run: |
          if [ -z "$DOCS_TOKEN" ]; then
            echo "::error::Secret DOCS_PUSH_TOKEN is not configured in this repository."
            exit 1
          fi
          git config user.name  "andyxu1234"
          git config user.email "69996462+andyxu1234@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${DOCS_TOKEN}@github.com/andyxu1234/soul_buddy-docs.git" /tmp/docs-repo
          rsync -a --delete --exclude '.git' docs/ /tmp/docs-repo/docs/
          cd /tmp/docs-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "同步主仓库文档更新 (${{ github.sha }})"
            git push
          fi
